version: '3.8'

# Local reference compose file. Production runs as a Portainer-managed stack
# on the TrueNAS host behind Traefik + Authelia (see README / deploy docs) —
# this file mirrors that setup for local testing of the HTTP transport.
services:
  instagram-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: instagram-mcp-server
    restart: unless-stopped
    environment:
      - LOG_LEVEL=DEBUG
      - CACHE_ENABLED=true
      - CACHE_TTL=300
      - RATE_LIMIT_CALLS_PER_HOUR=200
      - RATE_LIMIT_POSTS_PER_DAY=25
      - MCP_TRANSPORT=sse
      - PORT=8000
      - MCP_API_KEY=${MCP_API_KEY}
      - OIDC_CLIENT_ID=instagram-ferienhaus-mcp
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OAUTH_ISSUER=https://authelia.${DOMAIN}
      - OIDC_INTROSPECTION_URL=https://instagram-ferienhaus-mcp.${DOMAIN}/api/oidc/introspection
      - MCP_SERVER_URL=https://instagram-ferienhaus-mcp.${DOMAIN}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import src.config; print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge
